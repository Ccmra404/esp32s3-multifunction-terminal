name: Firmware build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/firmware-build.yml"
      - "Firmware/**"
  pull_request:
    paths:
      - ".github/workflows/firmware-build.yml"
      - "Firmware/**"
  workflow_dispatch:

jobs:
  esp32s3:
    name: ESP32-S3 / ESP-IDF v6.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build xiaozhi-esp32
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: Firmware/xiaozhi-esp32
          command: python scripts/build.py esp32s3-terminal
